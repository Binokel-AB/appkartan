name: Sprid regler

# Öppnar PR:er i alla appars repon när appkartans CLAUDE.md eller agenter ändras.
# Mergar aldrig något. Kräver hemligheten SPRID_TOKEN (se README).
on:
  push:
    branches: [main]
    paths:
      - CLAUDE.md
      - .claude/agents/**
      - scripts/sprid-regler.mjs
  workflow_dispatch:
    inputs:
      torrkorning:
        description: "Visa bara vad som skulle ändras (inga pushar, inga PR)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sprid-regler
  cancel-in-progress: false

jobs:
  sprid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test scripts/sprid-regler.test.mjs
      - name: Kontrollera att SPRID_TOKEN finns
        id: token
        env:
          SPRID_TOKEN: ${{ secrets.SPRID_TOKEN }}
        run: |
          if [ -z "$SPRID_TOKEN" ]; then
            echo "::notice title=Sprid regler hoppades över::Hemligheten SPRID_TOKEN är inte skapad än. Inget har ändrats. Se README, avsnittet Spridning av regler."
            echo "finns=false" >> "$GITHUB_OUTPUT"
          else
            echo "finns=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Sprid reglerna
        if: steps.token.outputs.finns == 'true'
        env:
          SPRID_TOKEN: ${{ secrets.SPRID_TOKEN }}
          TORRKORNING: ${{ github.event_name == 'workflow_dispatch' && inputs.torrkorning && '--torrkorning' || '' }}
        run: node scripts/sprid-regler.mjs $TORRKORNING
