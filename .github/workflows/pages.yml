name: Publicera appkartan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  kontrollera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/kontrollera.mjs
      - run: node --test scripts/sprid-regler.test.mjs

  publicera:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: kontrollera
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Packa bara det som ska synas
        run: |
          mkdir _site
          cp -r index.html sakerhet.html roller.html app.js sakerhet.js roller.js style.css data icons img _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
